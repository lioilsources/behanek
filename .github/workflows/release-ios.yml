name: Release iOS

# Tag v1.2.3 → IPA do GitHub Release + TestFlight. Ručně jde spustit bez tagu (jen TestFlight).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verze z tagu
        run: |
          # v1.2.3 → 1.2.3+<číslo běhu>; bez tagu verze z pubspecu.
          BASE="${GITHUB_REF_NAME#v}"
          echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          NEW="${BASE}+${{ github.run_number }}"
          sed -i.bak -E "s/^version: .*/version: ${NEW}/" pubspec.yaml && rm -f pubspec.yaml.bak
          echo "Build version: ${NEW}"

      - name: Podpisový certifikát
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Provisioning profil
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          DECODED=$(security cms -D -i "$PP_PATH")
          UUID=$(echo "$DECODED" | plutil -extract UUID raw -)
          NAME=$(echo "$DECODED" | plutil -extract Name raw -)
          APPID=$(echo "$DECODED" | plutil -extract Entitlements.application-identifier raw - | sed 's/^[^.]*\.//')
          echo "Profil: $NAME ($UUID), bundle $APPID, platí do $(echo "$DECODED" | plutil -extract ExpirationDate raw -)"
          [ "$APPID" = "cz.ol1n.behanek" ] || { echo "::error::profil je pro $APPID, ne cz.ol1n.behanek"; exit 1; }
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV

      - name: Ruční podpis jen pro Runner/Release
        run: python3 scripts/ci_ios_signing.py "$PROFILE_NAME"

      - name: Build Flutter iOS (bez podpisu)
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: flutter build ios --release --no-codesign --dart-define=MAPY_API_KEY="$MAPY_API_KEY"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:cz.ol1n.behanek $PROFILE_NAME" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      # Bez dSYM jsou crash reporty z TestFlightu jen holé adresy.
      - name: dSYMs
        run: |
          if [ -z "$(ls -A $RUNNER_TEMP/Runner.xcarchive/dSYMs 2>/dev/null)" ]; then
            echo "::warning::archiv neobsahuje dSYM"; exit 0
          fi
          mkdir -p $RUNNER_TEMP/dsyms
          ditto -c -k --sequesterRsrc --keepParent $RUNNER_TEMP/Runner.xcarchive/dSYMs \
            $RUNNER_TEMP/dsyms/Behanek-${{ github.ref_name }}-iOS-dSYMs.zip

      # IPA nejdřív na GitHub: výpadek Apple uploadu nesmí připravit release o build.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/dsyms/*.zip
          name: Běhánek ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: TestFlight
        continue-on-error: true
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "$(ls $RUNNER_TEMP/ipa/*.ipa)" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Úklid klíčů
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
