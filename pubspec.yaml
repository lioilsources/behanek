name: behanek
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.2
  audio_session: ^0.2.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_tts: ^4.2.5
  geolocator: ^14.1.2
  in_app_purchase: ^3.3.1
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

# Ikona: vybraná varianta bota_v4 (tools/appicon). `dart run flutter_launcher_icons`
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  # Android ořezává do kruhu — bota je široká, proto zmenšená na stejném pozadí.
  adaptive_icon_background: "#01070B"
  adaptive_icon_foreground: assets/icon/icon_android_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
